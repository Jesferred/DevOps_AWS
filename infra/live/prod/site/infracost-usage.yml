# Assumptions: ~5k visits/month plus synthetic probes. Amplify Hosting itself is
# not priced by Infracost; at this size it is within the free tier (15 GB served).
version: 0.1
resource_usage:
  aws_s3_bucket.site:
    standard:
      storage_gb: 0.05
      monthly_tier_1_requests: 9000 # release uploads + status.json every 5 min
      monthly_tier_2_requests: 140000 # status.json reads proxied by Amplify
  aws_route53_record.apex["A"]:
    monthly_standard_queries: 50000
  aws_route53_record.apex["AAAA"]:
    monthly_standard_queries: 20000
