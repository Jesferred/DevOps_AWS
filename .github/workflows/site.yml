name: site

on:
  # No path filter on PRs: these are required checks and must always report.
  pull_request:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_at: ${{ steps.lead.outputs.commit_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for DORA lead time

      - name: Earliest commit in this push
        id: lead
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "commit_at=$(.github/scripts/commit-time.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_DEPLOY_SHA: ${{ github.sha }}
          PUBLIC_DEPLOY_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          PUBLIC_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Strict CSP forbids inline scripts and styles; fail the build if any slip in.
      - name: Check CSP compatibility
        run: |
          if grep -rEl '<script(\s[^>]*)?>[^<]|<style|style="' --include='*.html' dist; then
            echo "::error::inline script/style found; it would be blocked by the CSP"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kovalov.in
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524941137773:role/gha-deploy-site-prod
          role-session-name: gha-deploy-site-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Publish release
        id: release
        working-directory: site/dist
        run: |
          bucket=$(aws ssm get-parameter --name /kovalov-in/prod/site/bucket --query Parameter.Value --output text)
          zip -qr ../site.zip .
          # Each upload is a new object version: the rollback history.
          version=$(aws s3api put-object --bucket "$bucket" --key releases/site.zip --body ../site.zip \
            --metadata "sha=$GITHUB_SHA,run=$GITHUB_RUN_ID" --query VersionId --output text)
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "Release \`${GITHUB_SHA::7}\` stored as version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Amplify
        working-directory: .
        env:
          BUCKET: ${{ steps.release.outputs.bucket }}
        run: .github/scripts/amplify-deploy.sh "$BUCKET"

      # DORA: every production deploy, failed ones included. Never fails the job.
      - name: Record deployment
        if: always() && job.status != 'cancelled'
        continue-on-error: true
        working-directory: .
        env:
          STATUS: ${{ job.status }}
          COMMIT_AT: ${{ needs.build.outputs.commit_at }}
        run: .github/scripts/record-deployment.sh site "$STATUS" "$COMMIT_AT"
