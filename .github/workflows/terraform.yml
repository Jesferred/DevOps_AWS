name: terraform

on:
  # No path filter on PRs: these are required checks and must always report.
  pull_request:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the OIDC token for AWS

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.13.4
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  # Kept out of the public repo; set under Settings > Secrets and variables > Variables.
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff infra

  plan:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/bootstrap
          - infra/live/global/dns
          - infra/live/global/github-oidc
          - infra/live/global/alerting
          - infra/live/prod/site
          - infra/live/prod/monitoring
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524941137773:role/gha-plan
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -detailed-exitcode | tee plan.txt || code=$?
          {
            echo "### \`${{ matrix.stack }}\`"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || tail -n 20 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = no changes, 2 = changes present; anything else is a failure
          [ "${code:-0}" -ne 1 ]

  # Single required check for branch protection, independent of the stack list.
  terraform:
    needs: [fmt, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All plans succeeded
        run: |
          echo "fmt=${{ needs.fmt.result }} plan=${{ needs.plan.result }}"
          [ "${{ needs.fmt.result }}" = success ] && [ "${{ needs.plan.result }}" = success ]

  # Runs only on main and waits for manual approval in the `production` environment.
  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Dependency order: state bucket -> DNS zone -> CI roles -> workloads.
      STACKS: >-
        infra/bootstrap
        infra/live/global/dns
        infra/live/global/github-oidc
        infra/live/global/alerting
        infra/live/prod/site
        infra/live/prod/monitoring
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524941137773:role/gha-apply
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform apply
        run: |
          for stack in $STACKS; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -input=false
            code=0
            terraform -chdir="$stack" plan -input=false -detailed-exitcode -out=tfplan || code=$?
            case $code in
              0) echo "no changes" ;;
              2) terraform -chdir="$stack" apply -input=false tfplan
                 echo "- \`$stack\`: applied" >> "$GITHUB_STEP_SUMMARY" ;;
              *) exit "$code" ;;
            esac
            echo "::endgroup::"
          done
